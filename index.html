<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Animación con JavaScript</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        img {
            width: 350px;
            margin-bottom: 30px;
        }

        .mensaje {
            font-size: 2.2rem;
            font-weight: bold;
            position: relative;
        }
    </style>
</head>
<body>

    <!-- Imagen centrada -->
    <img src="https://github.com/fchavezuerre/hola-mundo/blob/main/enca.png?raw=true?raw=true" alt="Imagen centrada">

    <!-- Mensaje animado -->
    <div class="mensaje" id="mensaje">
        ¡REALIZAR ACTIVIDAD Estoy en línea para dudas.................!
    </div>

    <script>
        const mensaje = document.getElementById("mensaje");

        let posicionY = 0;
        let velocidad = 1;
        let escala = 1;
        let creciendo = true;

        function animar() {
            // Movimiento vertical tipo rebote
            posicionY += velocidad;

            if (posicionY > 30 || posicionY < -30) {
                velocidad *= -1;
            }

            // Efecto zoom
            if (creciendo) {
                escala += 0.005;
                if (escala >= 1.1) creciendo = false;
            } else {
                escala -= 0.005;
                if (escala <= 1) creciendo = true;
            }

            mensaje.style.transform = `translateY(${posicionY}px) scale(${escala})`;

            requestAnimationFrame(animar);
        }

        animar();
    </script>

</body>
</html>
